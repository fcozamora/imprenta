services:
  mysql:
    image: mysql:8.4
    container_name: imprenta_mysql
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=-06:00
      - --event-scheduler=ON
      - --log-bin-trust-function-creators=1
      # Lo que antes vivia en db/conf/my.cnf. En Windows ese archivo montado
      # queda con permisos de escritura para todos y MySQL lo ignora entero,
      # asi que los ajustes van aca, donde no se pueden perder.
      - --innodb-buffer-pool-size=2G
      - --innodb-buffer-pool-instances=2
      - --innodb-redo-log-capacity=512M
      - --innodb-flush-log-at-trx-commit=1
      - --innodb-flush-method=O_DIRECT
      - --innodb-file-per-table=ON
      - --max-connections=200
      - --innodb-thread-concurrency=0
      - --table-open-cache=4000
      - --slow-query-log=1
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=0.5
      - --log-queries-not-using-indexes=0
      - --innodb-ft-min-token-size=2
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Costa_Rica
    volumes:
      - datos_mysql:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  app:
    build: .
    container_name: imprenta_app
    restart: always
    ports:
      - "80:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRA: 8h
      PASSWORD_RESET: ${PASSWORD_RESET}
      # Las muestras van al volumen, no a la capa del contenedor: si no,
      # se borran en cada reconstruccion.
      CARPETA_ALMACEN: /app/almacen
      TZ: America/Costa_Rica
    volumes:
      - datos_almacen:/app/almacen
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  datos_mysql:
    name: imprenta_mysql_datos
  datos_almacen:
    name: imprenta_almacen
